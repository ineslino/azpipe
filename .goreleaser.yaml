version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: azpipe
    binary: azpipe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ineslino/azpipe/cmd.buildVersion={{.Version}} -X github.com/ineslino/azpipe/cmd.buildCommit={{.FullCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: ineslino
    name: azpipe

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
