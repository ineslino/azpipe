<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AZPIPE: pipeline control from your terminal</title>
  <desc id="desc">Original terminal-inspired identity with connected select, review and monitor stages.</desc>
  <rect width="1200" height="420" rx="20" fill="#101416"/>
  <path d="M36 36H1164V384H36Z" fill="none" stroke="#344248"/>
  <rect x="64" y="64" width="210" height="36" fill="#c4ee24"/>
  <g font-family="monospace">
    <text x="80" y="89" font-size="20" font-weight="bold" fill="#101416">&gt; PIPELINE TUI</text>
    <text x="60" y="222" font-size="112" font-weight="bold" letter-spacing="6" fill="#f0f2ee">AZ<tspan fill="#c4ee24">PIPE</tspan></text>
    <text x="66" y="270" font-size="25" fill="#d4dadd">Your pipelines. One terminal.</text>
    <path d="M80 328H1100" stroke="#344248" stroke-width="2"/>
