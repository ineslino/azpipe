  <path d="M900 142H1030V204H1100M1030 142V92H1100M1030 142H1100" fill="none" stroke="#42caff" stroke-width="3"/>
  <g fill="#c4ee24"><rect x="884" y="130" width="24" height="24"/><rect x="1088" y="80" width="24" height="24"/><rect x="1088" y="130" width="24" height="24"/><rect x="1088" y="192" width="24" height="24"/></g>
